# Alacritty
# Referência completa: `man 5 alacritty`

[general]
live_config_reload = true

[font]
size = 11
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }

[window]
padding = { x = 10, y = 8 }
dynamic_padding = true
# Sem barra de título: no COSMIC a janela ainda move com Super+arrastar
decorations = "None"
# Leve transparência — descomente se quiser
# opacity = 0.95

[scrolling]
history = 10000

[cursor]
style = { shape = "Block", blinking = "Off" }

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

# ---------------------------------------------------------------------------
# Jellybeans HC — vendorizado de WTFox/jellybeans.nvim (extras/ghostty)
