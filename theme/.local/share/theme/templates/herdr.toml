# Gerado por `theme set`. Não edite aqui: os atalhos vivem no template em
# ~/.local/share/theme/templates/herdr.toml, e o tema sai do manifesto.
#
# O herdr reescreve este arquivo sozinho às vezes. Como ele mora fora do
# repositório, isso não suja mais o git — mas uma troca de tema pela UI do
# herdr é desfeita no próximo `theme set`.

onboarding = false

[ui.toast]
delivery = "system"

[ui]
status_indicators = "symbols"

[theme]
name = "@herdr_theme@"
auto_switch = false

# O tema "terminal" do herdr deriva dos 16 ANSI e acaba pondo o texto sobre a
# cor de acento. Em paleta escura os dois são tons claros: o contraste fica em
# 1.4-2.8:1, longe do mínimo 4.5:1 do WCAG AA. Não dá para consertar de fora —
# nós entregamos os ANSI, o pareamento é decisão do herdr.
#
# Estas chaves consertam: os fundos passam a ser os nossos três níveis escuros,
# e o texto (que segue o fg do ghostty) senta sobre escuro. Dá 6.4-16.3:1.
[theme.custom]
sidebar_bg    = "@bg_dark@"
panel_bg      = "@bg_dark@"
active_row_bg = "@bg_sel@"
selection_bg  = "@bg_sel@"
accent = "@blue@"
green  = "@green@"
blue   = "@blue@"
red    = "@red@"
yellow = "@yellow@"

# Direct chords (no prefix). The prefix bindings keep working alongside.
# alt+hjkl        -> move between panes/agents in the current Space
# alt+shift+j/k   -> next/previous Space
# alt+shift+h/l   -> previous/next tab
# alt+n/p         -> next/previous agent (across Spaces, via the agent panel)
# Heads-up: LazyVim uses alt+j/k to move lines; herdr now consumes them first.
[keys]
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
next_workspace = "alt+shift+j"
previous_workspace = "alt+shift+k"
previous_tab = ["prefix+p", "alt+shift+h"]
next_tab = ["prefix+n", "alt+shift+l"]
next_agent = "alt+n"
previous_agent = "alt+p"
