# kitty — espelho do alacritty.toml deste repositório
# Referência completa: `man 5 kitty.conf`
# Recarregar sem reabrir: Ctrl+Shift+F5

# ---------------------------------------------------------------------------
# Fonte
# ---------------------------------------------------------------------------
# A variante sem "Mono", como no alacritty. O kitty ainda amplia os ícones do
# Nerd Font para preencher a célula, e faz ligaduras (`->`, `!=`).
font_family      family="IosevkaTerm Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

# ---------------------------------------------------------------------------
# Janela
# ---------------------------------------------------------------------------
# vertical horizontal — o mesmo { x = 10, y = 8 } do alacritty
window_padding_width 8 10
# Sem barra de título: no COSMIC a janela ainda move com Super+arrastar
hide_window_decorations yes
# Leve transparência — descomente se quiser
# background_opacity 0.95
enable_audio_bell no

# ---------------------------------------------------------------------------
# Rolagem, cursor, mouse e seleção
# ---------------------------------------------------------------------------
scrollback_lines 10000

cursor_shape          block
cursor_blink_interval 0
# Sem isto, a integração com o shell troca o cursor por uma barra no prompt
shell_integration     no-cursor

# Negativo: esconde o ponteiro assim que se digita
mouse_hide_wait -1

copy_on_select clipboard

# ---------------------------------------------------------------------------
# Jellybeans HC — os mesmos hex do alacritty.toml
# ---------------------------------------------------------------------------
background #060606
foreground #f8f8f0

cursor            #c0e0ff
cursor_text_color #060606

selection_foreground #f8f8f0
selection_background #303030

# normal
color0  #060606
color1  #ff5050
color2  #c0d880
color3  #ffe080
color4  #98b0e0
color5  #d8c8ff
color6  #78a0b8
color7  #f8f8f0

# bright
color8  #909090
color9  #b02020
color10 #8cd468
color11 #ffc060
color12 #aad4f8
color13 #8800a8
color14 #aad4f8
color15 #f8f8f8

# indexed
color16 #ff5050
color17 #ffc800
color18 #0e0e0e
color19 #282828
color20 #686868
color21 #d8d8d8
