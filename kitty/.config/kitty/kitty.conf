# kitty — espelho do alacritty.toml deste repositório (fonte, padding, paleta)
# Referência completa: `man 5 kitty.conf`
# Recarregar sem reabrir: Ctrl+Shift+F5

# ---------------------------------------------------------------------------
# Fonte
# ---------------------------------------------------------------------------
# A variante sem "Mono", como no alacritty. O kitty ainda amplia os ícones do
# Nerd Font para preencher a célula, e faz ligaduras (`->`, `!=`).
font_family      family="IosevkaTerm Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

# ---------------------------------------------------------------------------
# Janela
# ---------------------------------------------------------------------------
# vertical horizontal — o mesmo { x = 10, y = 8 } do alacritty
window_padding_width 8 10
# Sem barra de título: no COSMIC a janela ainda move com Super+arrastar
hide_window_decorations yes
# Leve transparência — descomente se quiser
# background_opacity 0.95
enable_audio_bell no

# ---------------------------------------------------------------------------
# Rolagem, cursor, mouse e seleção
# ---------------------------------------------------------------------------
scrollback_lines 10000

cursor_shape          block
cursor_blink_interval 0
# Sem isto, a integração com o shell troca o cursor por uma barra no prompt
shell_integration     no-cursor

# Negativo: esconde o ponteiro assim que se digita
mouse_hide_wait -1

copy_on_select clipboard

# ---------------------------------------------------------------------------
# Paleta — Rosé Pine Moon, em current-theme.conf (gerado por `kitten themes`)
# Para trocar: kitten themes --reload-in=all "<nome>"
# ---------------------------------------------------------------------------
# BEGIN_KITTY_THEME
# Rosé Pine Moon
include current-theme.conf
# END_KITTY_THEME